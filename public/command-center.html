<style>
  :root{
    --navy-950:#0A0F1A;--navy-900:#0D1526;--navy-850:#101B30;--navy-800:#131F38;--navy-700:#1B2A47;--navy-600:#233757;--navy-500:#31496F;
    --ink-0:#EDF1F7;--ink-300:#B7C4D9;--ink-500:#8296B4;--ink-muted:#64789B;
    --cyan:#2FC4DE;--green:#33BE7D;--amber:#E4A73C;--red:#E1484F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--navy-950);}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .navlink{display:flex;align-items:center;gap:11px;padding:9px 16px;margin:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-500);}
  .navlink.active{background:var(--navy-800);color:var(--ink-0);}
  .navlink:hover{color:var(--ink-0);}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase;}
  .card{background:var(--navy-900);border:1px solid var(--navy-700);border-radius:12px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:7px;font-size:12.5px;font-weight:600;border:1px solid var(--navy-600);background:var(--navy-800);color:var(--ink-0);cursor:pointer;}
  .btn:hover{border-color:var(--cyan);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-primary{background:var(--cyan);border-color:var(--cyan);color:#06222A;}
  .btn-primary:hover{background:#4FD3E8;}
  .segbtn{padding:6px 12px;font-size:11.5px;font-weight:600;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--ink-500);cursor:pointer;}
  .segbtn.active{background:var(--navy-700);color:var(--ink-0);}
  .icnbtn{width:30px;height:30px;border-radius:7px;background:var(--navy-800);border:1px solid var(--navy-600);color:var(--ink-0);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .icnbtn:hover{border-color:var(--cyan);}
  .row{display:flex;align-items:center;}
  @keyframes pulse{0%{opacity:0.9;}50%{opacity:0.25;}100%{opacity:0.9;}}
  .pulse{animation:pulse 1.6s ease-in-out infinite;}
  .scroll::-webkit-scrollbar{width:6px;}
  .scroll::-webkit-scrollbar-thumb{background:var(--navy-600);border-radius:6px;}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width:100%;min-height:100vh;background:var(--navy-950);color:var(--ink-0);display:flex;flex-direction:row;">

  <!-- LEFT NAV -->
  <nav style="width:240px;flex-shrink:0;background:var(--navy-900);border-right:1px solid var(--navy-700);display:flex;flex-direction:column;padding:22px 0;position:sticky;top:0;height:100vh;">
    <div style="padding:0 24px 22px 24px;display:flex;align-items:center;gap:10px;">
      <div style="width:32px;height:32px;border-radius:8px;background:var(--navy-850);border:1px solid var(--cyan);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="#2FC4DE" stroke-width="1.75"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5" fill="#2FC4DE" stroke="none"></circle><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line></svg>
      </div>
      <div>
        <div style="font-weight:700;font-size:14.5px;">Civic Air</div>
        <div class="mono" style="font-size:9.5px;color:var(--ink-muted);letter-spacing:0.4px;text-transform:uppercase;">Northbridge Ops</div>
      </div>
    </div>
    <a href="/command-center" class="navlink active"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="8"></circle><line x1="12" y1="4" x2="12" y2="8"></line><line x1="12" y1="16" x2="12" y2="20"></line><line x1="4" y1="12" x2="8" y2="12"></line><line x1="16" y1="12" x2="20" y2="12"></line></svg>Command Center</a>
    <a href="/alerts" class="navlink"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 4 L21 19 L3 19 Z"></path><line x1="12" y1="10" x2="12" y2="14.5"></line><circle cx="12" cy="16.5" r="0.6" fill="currentColor"></circle></svg>Alerts</a>
    <a href="/flight-history" class="navlink"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="8.5"></circle><line x1="12" y1="7" x2="12" y2="12"></line><line x1="12" y1="12" x2="15.5" y2="14"></line></svg>Flight History</a>
    <a href="/data-request" class="navlink"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="5" y="3" width="14" height="18" rx="2"></rect><line x1="8.5" y1="8" x2="15.5" y2="8"></line><line x1="8.5" y1="12" x2="15.5" y2="12"></line><line x1="8.5" y1="16" x2="12.5" y2="16"></line></svg>Data Requests</a>
    <a href="/privacy-audit" class="navlink"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3 L19 6 V11 C19 16 16 19.5 12 21 C8 19.5 5 16 5 11 V6 Z"></path><path d="M9 12 L11 14 L15.5 9.5"></path></svg>Privacy &amp; Audit</a>
    <a href="/" class="navlink"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 13 L8 9 L12 15 L16 7 L20 12"></path></svg>System Status</a>
    <div style="margin-top:auto;padding:16px 24px 0 24px;border-top:1px solid var(--navy-800);">
      <div class="row" style="gap:8px;margin-top:14px;">
        <div style="width:7px;height:7px;border-radius:50%;background:var(--amber);"></div>
        <div class="mono" style="font-size:10.5px;color:var(--ink-muted);">3 sensors · 1 degraded</div>
      </div>
      <div style="font-size:11.5px;color:var(--ink-500);margin-top:10px;">M. Alvarez</div>
      <div class="mono" style="font-size:9.5px;color:var(--ink-muted);text-transform:uppercase;">Operations Lead · Authorized</div>
    </div>
  </nav>

  <!-- RIGHT COLUMN -->
  <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;">

    <!-- TOP BAR -->
    <div style="height:64px;flex-shrink:0;background:var(--navy-900);border-bottom:1px solid var(--navy-700);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;">
      <div class="row" style="gap:18px;">
        <div style="font-weight:700;font-size:14px;">Northbridge</div>
        <div class="mono" style="font-size:12.5px;color:var(--ink-500);">{{clock}}</div>
      </div>
      <div class="row" style="gap:22px;">
        <div class="row" style="gap:7px;"><div style="width:7px;height:7px;border-radius:50%;background:var(--amber);"></div><span style="font-size:12px;color:var(--ink-500);">Sensors: 3/4 · 1 degraded</span></div>
        <div class="row" style="gap:7px;"><div style="width:7px;height:7px;border-radius:50%;background:var(--cyan);"></div><span style="font-size:12px;color:var(--ink-500);">18 active drones</span></div>
        <div class="row" style="gap:7px;"><div style="width:7px;height:7px;border-radius:50%;background:var(--red);"></div><span style="font-size:12px;color:var(--ink-500);">3 open alerts</span></div>
        <div class="row" style="gap:8px;padding-left:18px;border-left:1px solid var(--navy-700);">
          <div style="width:26px;height:26px;border-radius:50%;background:var(--navy-700);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;">MA</div>
          <div>
            <div style="font-size:12px;font-weight:600;line-height:1.2;">M. Alvarez</div>
            <div class="mono" style="font-size:9.5px;color:var(--ink-muted);">OPERATIONS LEAD</div>
          </div>
        </div>
      </div>
    </div>

    <!-- MAIN -->
    <div style="flex-grow:1;display:flex;flex-direction:row;padding:20px;gap:20px;align-items:flex-start;">

      <!-- MAP PANEL -->
      <div class="card" style="flex-grow:1;min-width:0;overflow:hidden;">
        <div style="padding:14px 18px;border-bottom:1px solid var(--navy-700);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
          <div class="row" style="gap:14px;flex-wrap:wrap;">
            <span class="chip" style="background:rgba(228,167,60,0.14);color:var(--amber);"><span style="width:5px;height:5px;border-radius:50%;background:var(--amber);"></span>Simulation mode</span>
            <span class="mono" style="font-size:11px;color:var(--ink-muted);">18 active · 15 normal · 2 warning · 1 critical · 4 geofences</span>
          </div>
          <div class="row" style="gap:6px;">
            <sc-for list="{{timeRanges}}" as="tr">
              <button class="segbtn {{tr.cls}}" sc-camel-on-click="{{tr.pick}}">{{tr.label}}</button>
            </sc-for>
          </div>
        </div>

        <div style="position:relative;background:var(--navy-950);">
          <svg sc-camel-view-box="{{viewBox}}" style="width:100%;height:560px;display:block;">
            <defs>
              <pattern id="grid" width="40" height="40" sc-camel-pattern-units="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131F38" stroke-width="1"></path>
              </pattern>
            </defs>
            <rect x="-400" y="-400" width="1800" height="1400" fill="url(#grid)"></rect>

            <!-- river -->
            <rect x="-40" y="330" width="1100" height="34" rx="17" fill="#101B30" transform="rotate(-6 500 340)"></rect>

            <!-- streets -->
            <g stroke="#1B2A47" stroke-width="10" opacity="{{geoOpacity}}">
              <line x1="0" y1="120" x2="1000" y2="120"></line>
              <line x1="0" y1="470" x2="1000" y2="470"></line>
              <line x1="260" y1="0" x2="260" y2="640"></line>
              <line x1="700" y1="0" x2="700" y2="640"></line>
            </g>

            <!-- geofences -->
            <g style="opacity:{{geoOpacity}};">
              <ellipse cx="150" cy="140" rx="130" ry="90" fill="rgba(47,196,222,0.06)" stroke="#2FC4DE" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 5"></ellipse>
              <text x="150" y="230" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" fill="#7FB9C9">NORTHBRIDGE RGNL AIRPORT</text>

              <circle cx="560" cy="260" r="72" fill="rgba(228,167,60,0.08)" stroke="#E4A73C" stroke-width="2" stroke-dasharray="7 5"></circle>
              <text x="560" y="345" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" fill="#E4A73C">AURORA STADIUM · TEMP RESTRICTION</text>

              <g transform="rotate(-10 810 415)">
                <rect x="680" y="380" width="260" height="66" rx="33" fill="rgba(47,196,222,0.05)" stroke="#2FC4DE" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 5"></rect>
              </g>
              <text x="810" y="470" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" fill="#7FB9C9">MERCY HOSPITAL CORRIDOR</text>

              <circle cx="642" cy="205" r="26" fill="rgba(228,167,60,0.12)" stroke="#E4A73C" stroke-width="1.5" stroke-dasharray="4 4"></circle>
              <text x="642" y="168" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="#E4A73C">EMERGENCY SCENE</text>
            </g>

            <!-- selected route -->
            <sc-if value="{{hasRoute}}" hint-placeholder-val="{{true}}">
              <polyline points="{{routePoints}}" fill="none" stroke="{{selectedColor}}" stroke-width="2.5" stroke-dasharray="5 5" opacity="{{pathOpacity}}"></polyline>
            </sc-if>

            <!-- drones -->
            <g opacity="{{droneOpacity}}">
              <sc-for list="{{drones}}" as="d" hint-placeholder-count="10">
                <g transform="{{d.markerTransform}}" style="cursor:pointer;" sc-camel-on-click="{{d.pick}}">
                  <sc-if value="{{d.selected}}" hint-placeholder-val="{{false}}">
                    <circle r="18" fill="none" stroke="{{d.color}}" stroke-width="2" class="pulse"></circle>
                  </sc-if>
                  <polygon points="0,-10 8,8 0,4 -8,8" fill="{{d.color}}" stroke="{{d.ring}}" stroke-width="{{d.ringWidth}}" stroke-dasharray="{{d.ringDash}}"></polygon>
                </g>
              </sc-for>
            </g>
          </svg>

          <!-- layer control -->
          <div class="card" style="position:absolute;top:14px;left:14px;padding:12px 14px;background:rgba(13,21,38,0.92);">
            <div class="mono" style="font-size:9.5px;color:var(--ink-muted);text-transform:uppercase;margin-bottom:8px;letter-spacing:0.4px;">Layers</div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-300);"><input type="checkbox" checked="{{layerDrones}}" sc-camel-on-change="{{toggleDrones}}"> Drones</label>
              <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-300);"><input type="checkbox" checked="{{layerGeo}}" sc-camel-on-change="{{toggleGeo}}"> Geofences</label>
              <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-300);"><input type="checkbox" checked="{{layerPaths}}" sc-camel-on-change="{{togglePaths}}"> Flight paths</label>
            </div>
          </div>

          <!-- zoom control -->
          <div class="row" style="position:absolute;top:14px;right:14px;gap:6px;">
            <button class="icnbtn" sc-camel-on-click="{{zoomOut}}" aria-label="Zoom out">−</button>
            <div class="card mono" style="padding:0 10px;height:30px;display:flex;align-items:center;font-size:11.5px;background:rgba(13,21,38,0.92);">{{zoomLabel}}</div>
            <button class="icnbtn" sc-camel-on-click="{{zoomIn}}" aria-label="Zoom in">+</button>
          </div>

          <!-- playback bar -->
          <div class="row" style="position:absolute;bottom:14px;left:14px;right:14px;justify-content:space-between;background:rgba(13,21,38,0.92);border:1px solid var(--navy-700);border-radius:10px;padding:10px 16px;">
            <div class="row" style="gap:10px;">
              <button class="icnbtn" sc-camel-on-click="{{togglePlay}}" aria-label="{{playLabel}}">
                <sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
                  <svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16"></rect><rect x="14" y="4" width="5" height="16"></rect></svg>
                </sc-if>
                <sc-if value="{{notPlaying}}" hint-placeholder-val="{{false}}">
                  <svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="currentColor"><path d="M6 4 L20 12 L6 20 Z"></path></svg>
                </sc-if>
              </button>
              <div class="row" style="gap:7px;">
                <div style="width:6px;height:6px;border-radius:50%;background:{{statusDotColor}};" class="{{statusDotCls}}"></div>
                <span class="mono" style="font-size:11.5px;color:var(--ink-300);">{{playbackLabel}}</span>
              </div>
            </div>
            <div class="mono" style="font-size:10.5px;color:var(--ink-muted);">Fictional map data · Northbridge simulation grid</div>
          </div>
        </div>
      </div>

      <!-- SIDEBAR -->
      <div style="width:380px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;">

        <!-- Alerts -->
        <div class="card">
          <button sc-camel-on-click="{{toggleAlerts}}" style="width:100%;background:none;border:none;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:inherit;">
            <span class="row" style="gap:8px;font-size:13px;font-weight:600;"><svg width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2"><path d="M12 4 L21 19 L3 19 Z"></path></svg>Active Alerts (3)</span>
            <span class="mono" style="font-size:12px;color:var(--ink-muted);">{{alertsChevron}}</span>
          </button>
          <sc-if value="{{alertsExpanded}}" hint-placeholder-val="{{true}}">
            <div style="border-top:1px solid var(--navy-700);">
              <sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
                <div style="padding:12px 16px;border-bottom:1px solid var(--navy-800);cursor:pointer;" sc-camel-on-click="{{a.focus}}">
                  <div class="row" style="justify-content:space-between;margin-bottom:5px;">
                    <span class="chip" style="background:{{a.bg}};color:{{a.color}};">{{a.severity}}</span>
                    <span class="mono" style="font-size:10.5px;color:var(--ink-muted);">{{a.time}}</span>
                  </div>
                  <div style="font-size:12.5px;font-weight:600;margin-bottom:2px;">{{a.title}}</div>
                  <div style="font-size:11.5px;color:var(--ink-muted);margin-bottom:6px;">{{a.location}} · {{a.droneId}}</div>
                  <div class="row" style="justify-content:space-between;">
                    <span class="mono" style="font-size:10px;color:var(--ink-muted);text-transform:uppercase;">{{a.status}} · {{a.assigned}}</span>
                    <button class="btn" style="padding:4px 9px;font-size:10.5px;" sc-camel-on-click="{{a.ack}}" disabled="{{a.ackDisabled}}">{{a.ackLabel}}</button>
                  </div>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>

        <!-- Fleet -->
        <div class="card">
          <button sc-camel-on-click="{{toggleFleet}}" style="width:100%;background:none;border:none;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:inherit;">
            <span style="font-size:13px;font-weight:600;">Fleet (showing 10 of 18)</span>
            <span class="mono" style="font-size:12px;color:var(--ink-muted);">{{fleetChevron}}</span>
          </button>
          <sc-if value="{{fleetExpanded}}" hint-placeholder-val="{{true}}">
            <div class="scroll" style="border-top:1px solid var(--navy-700);max-height:220px;overflow-y:auto;">
              <sc-for list="{{drones}}" as="d" hint-placeholder-count="10">
                <div sc-camel-on-click="{{d.pick}}" style="padding:9px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;background:{{d.rowBg}};">
                  <div style="width:7px;height:7px;border-radius:50%;background:{{d.color}};flex-shrink:0;"></div>
                  <div style="min-width:0;flex-grow:1;">
                    <div class="mono" style="font-size:12px;font-weight:600;">{{d.id}}</div>
                    <div style="font-size:10.5px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{d.operatorCategory}}</div>
                  </div>
                  <div class="mono" style="font-size:10px;color:var(--ink-muted);">{{d.altitude}}ft</div>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>

        <!-- Selected drone detail -->
        <div class="card" style="padding:18px;">
          <div class="row" style="justify-content:space-between;margin-bottom:4px;">
            <div class="mono" style="font-size:16px;font-weight:700;">{{sd.id}}</div>
            <span class="chip" style="background:{{sd.statusBg}};color:{{sd.statusColor}};">{{sd.status}}</span>
          </div>
          <div style="font-size:12px;color:var(--ink-muted);margin-bottom:16px;">{{sd.operatorCategory}}</div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
            <div><div class="mono" style="font-size:9.5px;color:var(--ink-muted);text-transform:uppercase;">Altitude</div><div class="mono" style="font-size:14px;font-weight:600;">{{sd.altitude}} ft</div></div>
            <div><div class="mono" style="font-size:9.5px;color:var(--ink-muted);text-transform:uppercase;">Speed</div><div class="mono" style="font-size:14px;font-weight:600;">{{sd.speed}} mph</div></div>
            <div><div class="mono" style="font-size:9.5px;color:var(--ink-muted);text-transform:uppercase;">Direction</div><div class="mono" style="font-size:14px;font-weight:600;">{{sd.direction}}</div></div>
            <div><div class="mono" style="font-size:9.5px;color:var(--ink-muted);text-transform:uppercase;">Signal</div><div class="mono" style="font-size:14px;font-weight:600;color:{{sd.signalColor}};">{{sd.signal}}</div></div>
          </div>

          <div class="row" style="justify-content:space-between;font-size:11px;color:var(--ink-muted);margin-bottom:14px;">
            <span>First detected {{sd.firstDetected}}</span><span>Updated {{sd.lastUpdated}}</span>
          </div>

          <div style="margin-bottom:14px;">
            <div class="mono" style="font-size:9.5px;color:var(--ink-muted);text-transform:uppercase;margin-bottom:6px;">Nearby restricted zones</div>
            <sc-for list="{{sd.zones}}" as="z">
              <div style="font-size:12px;color:var(--ink-300);padding:3px 0;">· {{z}}</div>
            </sc-for>
          </div>

          <div class="card" style="background:var(--navy-850);padding:12px;margin-bottom:14px;">
            <div class="row" style="justify-content:space-between;margin-bottom:6px;">
              <span class="mono" style="font-size:9.5px;color:var(--ink-muted);text-transform:uppercase;">Risk score</span>
              <span class="mono" style="font-size:15px;font-weight:700;color:{{sd.riskColor}};">{{sd.riskScore}}/100</span>
            </div>
            <div style="font-size:11.5px;color:var(--ink-300);line-height:1.5;">{{sd.riskWhy}}</div>
          </div>

          <sc-if value="{{hasActionMessage}}" hint-placeholder-val="{{false}}">
            <div class="card" style="padding:10px 12px;margin-bottom:12px;background:{{actionMessage.bg}};border-color:{{actionMessage.border}};">
              <div style="font-size:12px;color:{{actionMessage.color}};font-weight:600;">{{actionMessage.text}}</div>
            </div>
          </sc-if>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button class="btn" sc-camel-on-click="{{doMonitor}}">Monitor</button>
            <button class="btn" sc-camel-on-click="{{doIncident}}">Create incident</button>
            <button class="btn" sc-camel-on-click="{{doDismiss}}" disabled="{{sd.dismissDisabled}}">Dismiss alert</button>
            <button class="btn" sc-camel-on-click="{{doRequest}}">Request info</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</template>
<script src="/dc.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var drones = [
      { id: 'DRN-2048', status: 'Unidentified', operatorCategory: 'Unknown - not linked to registry', alertLevel: 'critical', x: 610, y: 205, heading: 45, altitude: 410, speed: 28, direction: 'Northeast (048°)', signal: 'Fair', firstDetected: '8:40 PM', lastUpdated: '8:47 PM', zones: ['Aurora Stadium - Temporary Event Restriction (active violation)', 'Northbridge Rgnl Airport - 2.4 mi'], riskScore: 78, riskWhy: 'Entered an active temporary flight restriction over a public event and has not responded to broadcast identification. Speed and altitude are otherwise within normal range.', route: [[560,260],[585,235],[610,205]] },
      { id: 'DRN-1183', status: 'Registered', operatorCategory: 'Public Utility Inspection', alertLevel: 'warning', x: 760, y: 400, heading: 120, altitude: 620, speed: 14, direction: 'Southeast (140°)', signal: 'Strong', firstDetected: '8:02 PM', lastUpdated: '8:31 PM', zones: ['Mercy Hospital Corridor - 400 ft ceiling'], riskScore: 44, riskWhy: 'Flying above the posted ceiling for the hospital corridor. No restricted-zone entry; operator has been notified by broadcast.', route: [[700,380],[760,400]] },
      { id: 'DRN-0876', status: 'Registered', operatorCategory: 'Commercial - Aerial Photography', alertLevel: 'warning', x: 340, y: 480, heading: 200, altitude: 260, speed: 9, direction: 'Southwest (200°)', signal: 'Weak', firstDetected: '7:48 PM', lastUpdated: '8:15 PM', zones: ['None currently'], riskScore: 31, riskWhy: 'Telemetry signal has degraded intermittently for the last 12 minutes. Last confirmed position is within normal operating bounds.', route: [[380,440],[340,480]] },
      { id: 'DRN-3312', status: 'Registered', operatorCategory: 'Commercial - Real Estate Photography', alertLevel: 'normal', x: 230, y: 300, heading: 300, altitude: 180, speed: 11, direction: 'Northwest (300°)', signal: 'Strong', firstDetected: '7:20 PM', lastUpdated: '8:46 PM', zones: ['None'], riskScore: 6, riskWhy: 'Operating normally within registered flight parameters.', route: [[260,330],[230,300]] },
