<style>
  :root{
    --navy-950:#0A0F1A;--navy-900:#0D1526;--navy-850:#101B30;--navy-800:#131F38;--navy-700:#1B2A47;--navy-600:#233757;
    --ink-0:#EDF1F7;--ink-300:#B7C4D9;--ink-500:#8296B4;--ink-muted:#64789B;
    --cyan:#2FC4DE;--green:#33BE7D;--amber:#E4A73C;--red:#E1484F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--navy-950);}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}
  textarea{font-family:inherit;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .navlink{display:flex;align-items:center;gap:11px;padding:9px 16px;margin:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-500);}
  .navlink.active{background:var(--navy-800);color:var(--ink-0);}
  .navlink:hover{color:var(--ink-0);}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase;}
  .card{background:var(--navy-900);border:1px solid var(--navy-700);border-radius:12px;}
  .row{display:flex;align-items:center;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:7px;font-size:12.5px;font-weight:600;border:1px solid var(--navy-600);background:var(--navy-800);color:var(--ink-0);cursor:pointer;}
  .btn:hover{border-color:var(--cyan);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-primary{background:var(--cyan);border-color:var(--cyan);color:#06222A;}
  .filterchip{padding:6px 13px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--navy-600);background:var(--navy-900);color:var(--ink-500);cursor:pointer;white-space:nowrap;}
  .filterchip.active{background:var(--navy-700);color:var(--ink-0);border-color:var(--cyan);}
  .scroll::-webkit-scrollbar{width:6px;}
  .scroll::-webkit-scrollbar-thumb{background:var(--navy-600);border-radius:6px;}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width:100%;min-height:100vh;background:var(--navy-950);color:var(--ink-0);display:flex;flex-direction:row;">

  <nav style="width:240px;flex-shrink:0;background:var(--navy-900);border-right:1px solid var(--navy-700);display:flex;flex-direction:column;padding:22px 0;position:sticky;top:0;height:100vh;">
    <div style="padding:0 24px 22px 24px;display:flex;align-items:center;gap:10px;">
      <div style="width:32px;height:32px;border-radius:8px;background:var(--navy-850);border:1px solid var(--cyan);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="#2FC4DE" stroke-width="1.75"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5" fill="#2FC4DE" stroke="none"></circle><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line></svg>
      </div>
      <div><div style="font-weight:700;font-size:14.5px;">Civic Air</div><div class="mono" style="font-size:9.5px;color:var(--ink-muted);letter-spacing:0.4px;text-transform:uppercase;">Northbridge Ops</div></div>
    </div>
    <a href="/command-center" class="navlink"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="8"></circle><line x1="12" y1="4" x2="12" y2="8"></line><line x1="12" y1="16" x2="12" y2="20"></line><line x1="4" y1="12" x2="8" y2="12"></line><line x1="16" y1="12" x2="20" y2="12"></line></svg>Command Center</a>
    <a href="/alerts" class="navlink active"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 4 L21 19 L3 19 Z"></path><line x1="12" y1="10" x2="12" y2="14.5"></line><circle cx="12" cy="16.5" r="0.6" fill="currentColor"></circle></svg>Alerts</a>
    <a href="/flight-history" class="navlink"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="8.5"></circle><line x1="12" y1="7" x2="12" y2="12"></line><line x1="12" y1="12" x2="15.5" y2="14"></line></svg>Flight History</a>
    <a href="/data-request" class="navlink"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="5" y="3" width="14" height="18" rx="2"></rect><line x1="8.5" y1="8" x2="15.5" y2="8"></line><line x1="8.5" y1="12" x2="15.5" y2="12"></line><line x1="8.5" y1="16" x2="12.5" y2="16"></line></svg>Data Requests</a>
    <a href="/privacy-audit" class="navlink"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3 L19 6 V11 C19 16 16 19.5 12 21 C8 19.5 5 16 5 11 V6 Z"></path><path d="M9 12 L11 14 L15.5 9.5"></path></svg>Privacy &amp; Audit</a>
    <a href="/" class="navlink"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 13 L8 9 L12 15 L16 7 L20 12"></path></svg>System Status</a>
    <div style="margin-top:auto;padding:16px 24px 0 24px;border-top:1px solid var(--navy-800);">
      <div style="font-size:11.5px;color:var(--ink-500);margin-top:14px;">M. Alvarez</div>
      <div class="mono" style="font-size:9.5px;color:var(--ink-muted);text-transform:uppercase;">Operations Lead · Authorized</div>
    </div>
  </nav>

  <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;">
    <div style="height:64px;flex-shrink:0;background:var(--navy-900);border-bottom:1px solid var(--navy-700);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;">
      <div class="row" style="gap:18px;"><div style="font-weight:700;font-size:14px;">Northbridge</div><div class="mono" style="font-size:12.5px;color:var(--ink-500);">Alerts &amp; Incidents</div></div>
      <div class="row" style="gap:22px;">
        <div class="row" style="gap:7px;"><div style="width:7px;height:7px;border-radius:50%;background:var(--red);"></div><span style="font-size:12px;color:var(--ink-500);">3 open alerts</span></div>
        <div class="row" style="gap:8px;padding-left:18px;border-left:1px solid var(--navy-700);">
          <div style="width:26px;height:26px;border-radius:50%;background:var(--navy-700);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;">MA</div>
          <div><div style="font-size:12px;font-weight:600;line-height:1.2;">M. Alvarez</div><div class="mono" style="font-size:9.5px;color:var(--ink-muted);">OPERATIONS LEAD</div></div>
        </div>
      </div>
    </div>

    <div style="flex-grow:1;display:flex;flex-direction:row;padding:24px;gap:20px;align-items:flex-start;">

      <!-- Queue -->
      <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:14px;">
        <div>
          <div style="font-size:20px;font-weight:700;margin-bottom:4px;">Alert queue</div>
          <div style="font-size:13px;color:var(--ink-muted);">Prioritized by severity. Escalation requires human review.</div>
        </div>
        <div class="row" style="gap:8px;overflow-x:auto;padding-bottom:2px;">
          <sc-for list="{{categories}}" as="c">
            <button class="filterchip {{c.cls}}" sc-camel-on-click="{{c.pick}}">{{c.label}}</button>
          </sc-for>
        </div>

        <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
          <div class="card" style="padding:60px 20px;text-align:center;">
            <div style="font-size:14px;font-weight:600;margin-bottom:6px;">No alerts in this category</div>
            <div style="font-size:12.5px;color:var(--ink-muted);">Try a different filter, or select "All" to see the full queue.</div>
          </div>
        </sc-if>

        <div style="display:flex;flex-direction:column;gap:10px;">
          <sc-for list="{{alerts}}" as="a" hint-placeholder-count="6">
            <div class="card" style="padding:16px;cursor:pointer;border-color:{{a.borderColor}};" sc-camel-on-click="{{a.pick}}">
              <div class="row" style="justify-content:space-between;margin-bottom:8px;">
                <div class="row" style="gap:10px;">
                  <span class="chip" style="background:{{a.bg}};color:{{a.color}};">{{a.severity}}</span>
                  <span style="font-size:14px;font-weight:600;">{{a.title}}</span>
                </div>
                <span class="mono" style="font-size:11px;color:var(--ink-muted);">{{a.time}}</span>
              </div>
              <div class="row" style="gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink-300);">
                <span class="mono">{{a.droneId}}</span>
                <span>{{a.location}}</span>
                <span class="mono" style="color:var(--ink-muted);text-transform:uppercase;">{{a.status}}</span>
                <span style="color:var(--ink-muted);">Assigned: {{a.assigned}}</span>
              </div>
              <div style="font-size:12px;color:var(--ink-muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--navy-800);">Next step: {{a.nextStep}}</div>
            </div>
          </sc-for>
        </div>
      </div>

      <!-- Incident detail -->
      <div class="card" style="width:420px;flex-shrink:0;padding:20px;position:sticky;top:88px;">
        <div class="row" style="justify-content:space-between;margin-bottom:4px;">
          <span class="chip" style="background:{{sel.bg}};color:{{sel.color}};">{{sel.severity}}</span>
          <span class="mono" style="font-size:11px;color:var(--ink-muted);">{{sel.id}}</span>
        </div>
        <div style="font-size:16px;font-weight:700;margin-bottom:2px;">{{sel.title}}</div>
        <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:18px;">{{sel.droneId}} · {{sel.location}}</div>

        <div class="mono" style="font-size:10px;color:var(--ink-muted);text-transform:uppercase;margin-bottom:10px;">Incident timeline</div>
        <div style="display:flex;flex-direction:column;gap:0;margin-bottom:18px;">
          <sc-for list="{{sel.timeline}}" as="ev">
            <div style="display:flex;gap:12px;">
              <div style="display:flex;flex-direction:column;align-items:center;">
                <div style="width:8px;height:8px;border-radius:50%;background:var(--cyan);flex-shrink:0;margin-top:4px;"></div>
                <div style="width:1px;flex-grow:1;background:var(--navy-700);min-height:18px;"></div>
              </div>
              <div style="padding-bottom:14px;">
                <div class="mono" style="font-size:10.5px;color:var(--ink-muted);">{{ev.time}}</div>
                <div style="font-size:12.5px;color:var(--ink-300);">{{ev.text}}</div>
              </div>
            </div>
          </sc-for>
        </div>

        <div class="mono" style="font-size:10px;color:var(--ink-muted);text-transform:uppercase;margin-bottom:8px;">Operator notes</div>
        <textarea value="{{notes}}" sc-camel-on-change="{{onNotes}}" style="width:100%;min-height:70px;background:var(--navy-850);border:1px solid var(--navy-700);border-radius:8px;color:var(--ink-0);font-size:12.5px;padding:10px;margin-bottom:16px;resize:vertical;"></textarea>

        <div class="card" style="background:var(--navy-850);padding:14px;margin-bottom:14px;">
          <label style="display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--ink-300);cursor:pointer;">
            <input type="checkbox" checked="{{reviewed}}" sc-camel-on-change="{{onReview}}" style="margin-top:2px;">
            I have reviewed this incident and confirm escalation is warranted.
          </label>
        </div>

        <sc-if value="{{escalated}}" hint-placeholder-val="{{false}}">
          <div class="card" style="padding:10px 12px;margin-bottom:12px;background:rgba(51,190,125,0.12);border-color:var(--green);">
            <div style="font-size:12px;color:var(--green);font-weight:600;">Escalated to Northbridge PD - Air Safety Unit. Action recorded to the audit log.</div>
          </div>
        </sc-if>

        <button class="btn btn-primary" style="width:100%;" sc-camel-on-click="{{onEscalate}}" disabled="{{escalateDisabled}}">Escalate to Air Safety Unit</button>
        <div style="font-size:11px;color:var(--ink-muted);margin-top:8px;text-align:center;">Escalation is blocked until human review is confirmed above.</div>
      </div>
    </div>
  </div>
</div>
</template>
<script src="/dc.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.allAlerts = [
      { id: 'AL-1', category: 'Restricted-zone entry', severity: 'Critical', title: 'Restricted-zone entry', droneId: 'DRN-2048', location: 'Aurora Stadium', time: '8:42 PM', status: 'Open', assigned: 'Ops Team Alpha', nextStep: 'Confirm identity broadcast; file incident report if unresolved by 8:50 PM.',
        timeline: [ { time: '8:40 PM', text: 'DRN-2048 first detected on approach, Sector 3.' }, { time: '8:42 PM', text: 'Entered Aurora Stadium temporary restriction boundary - alert generated.' }, { time: '8:43 PM', text: 'Broadcast identification request sent - no response received.' }, { time: '8:45 PM', text: 'Ops Team Alpha dispatched to monitor from ground station.' }, { time: '8:47 PM', text: 'Drone moved northeast, remains within 0.3 mi of restricted boundary.' } ],
        notesDefault: 'Awaiting registry match. No visual identification yet. Event security notified at 8:44 PM.' },
      { id: 'AL-2', category: 'Unsafe altitude', severity: 'Warning', title: 'Unsafe altitude', droneId: 'DRN-1183', location: 'Mercy Hospital Corridor', time: '8:31 PM', status: 'Acknowledged', assigned: 'Ops Team Bravo', nextStep: 'Monitor descent; notify corridor coordinator if unresolved within 5 minutes.',
        timeline: [ { time: '8:28 PM', text: 'DRN-1183 entered Mercy Hospital Corridor at registered altitude.' }, { time: '8:31 PM', text: 'Climbed to 620 ft, above the 400 ft corridor ceiling - alert generated.' }, { time: '8:33 PM', text: 'Operator notified by automated broadcast.' } ],
        notesDefault: 'Registered utility inspection flight. Likely a routine climb; watching for descent.' },
      { id: 'AL-3', category: 'Signal lost', severity: 'Warning', title: 'Signal lost', droneId: 'DRN-0876', location: 'Sector 4', time: '8:15 PM', status: 'Open', assigned: 'Unassigned', nextStep: 'Attempt re-acquire via Sensor 2; escalate if signal lost for over 10 minutes.',
        timeline: [ { time: '8:03 PM', text: 'Signal quality began degrading.' }, { time: '8:15 PM', text: 'Telemetry link intermittently lost - alert generated.' } ],
        notesDefault: '' },
      { id: 'AL-4', category: 'Possible collision path', severity: 'Warning', title: 'Possible collision path', droneId: 'DRN-4470 / DRN-5561', location: 'Sector 2 airspace', time: '7:58 PM', status: 'Resolved', assigned: 'Ops Team Alpha', nextStep: 'Paths have diverged; no further action required.',
        timeline: [ { time: '7:56 PM', text: 'Projected flight paths of DRN-4470 and DRN-5561 converged within 200 ft.' }, { time: '7:58 PM', text: 'Automated conflict alert generated.' }, { time: '8:01 PM', text: 'Paths diverged; both drones confirmed clear.' } ],
        notesDefault: 'Resolved without operator intervention. Logged for pattern review.' },
      { id: 'AL-5', category: 'Unidentified drone', severity: 'Warning', title: 'Unidentified drone', droneId: 'DRN-6154', location: 'Riverside Park', time: '7:40 PM', status: 'Open', assigned: 'Ops Team Bravo', nextStep: 'Attempt registry match; monitor only - no restricted-zone entry.',
        timeline: [ { time: '7:40 PM', text: 'Detected with no matching registry record.' }, { time: '7:44 PM', text: 'Confirmed operating below 200 ft, outside all geofenced zones.' } ],
        notesDefault: 'No registry match. Not in a restricted zone; monitoring only per policy.' },
      { id: 'AL-6', category: 'Emergency corridor obstruction', severity: 'Warning', title: 'Emergency corridor obstruction', droneId: 'DRN-7734', location: 'Mercy Hospital Corridor', time: '8:36 PM', status: 'Open', assigned: 'Unassigned', nextStep: 'Reroute delivery flight if obstruction continues past 8:45 PM.',
        timeline: [ { time: '8:34 PM', text: 'DRN-7734 delivery flight entered the emergency approach corridor.' }, { time: '8:36 PM', text: 'Positioned along the active medevac approach path - alert generated.' } ],
        notesDefault: '' }
    ];
    this.state = { filter: 'All', selectedId: 'AL-1', notesById: {}, reviewedById: {}, escalatedById: {} };
    this.pickFilter = this.pickFilter.bind(this);
    this.pickAlert = this.pickAlert.bind(this);
    this.onNotes = this.onNotes.bind(this);
    this.onReview = this.onReview.bind(this);
    this.onEscalate = this.onEscalate.bind(this);
  }
  pickFilter(c) { this.setState({ filter: c }); }
  pickAlert(id) { this.setState({ selectedId: id }); }
  onNotes(e) {
    var v = e && e.target ? e.target.value : '';
    var m = Object.assign({}, this.state.notesById); m[this.state.selectedId] = v;
    this.setState({ notesById: m });
  }
  onReview(e) {
    var v = e && e.target ? e.target.checked : true;
    var m = Object.assign({}, this.state.reviewedById); m[this.state.selectedId] = v;
    this.setState({ reviewedById: m });
  }
  onEscalate() {
    if (!this.state.reviewedById[this.state.selectedId]) return;
    var m = Object.assign({}, this.state.escalatedById); m[this.state.selectedId] = true;
    this.setState({ escalatedById: m });
  }
  renderVals() {
    var self = this;
    var cats = ['All', 'Restricted-zone entry', 'Unsafe altitude', 'Signal lost', 'Possible collision path', 'Unidentified drone', 'Emergency corridor obstruction'];
    var categories = cats.map(function (c) { return { label: c, cls: self.state.filter === c ? 'active' : '', pick: function () { self.pickFilter(c); } }; });
    var sevStyle = { Critical: { bg: 'rgba(225,72,79,0.16)', color: '#E1484F', border: 'rgba(225,72,79,0.35)' }, Warning: { bg: 'rgba(228,167,60,0.16)', color: '#E4A73C', border: 'var(--navy-700)' } };
    var filtered = this.allAlerts.filter(function (a) { return self.state.filter === 'All' || a.category === self.state.filter; });
    var alerts = filtered.map(function (a) {
      var s = sevStyle[a.severity];
      return Object.assign({}, a, { bg: s.bg, color: s.color, borderColor: a.id === self.state.selectedId ? '#2FC4DE' : s.border, pick: function () { self.pickAlert(a.id); } });
    });
    var selRaw = this.allAlerts.filter(function (a) { return a.id === self.state.selectedId; })[0] || this.allAlerts[0];
    var s2 = sevStyle[selRaw.severity];
    var sel = Object.assign({}, selRaw, { bg: s2.bg, color: s2.color });
    var reviewed = !!this.state.reviewedById[self.state.selectedId];
    var escalated = !!this.state.escalatedById[self.state.selectedId];
    var notes = this.state.notesById[self.state.selectedId];
    if (notes === undefined) notes = selRaw.notesDefault;
    return {
      categories: categories,
      alerts: alerts,
      isEmpty: alerts.length === 0,
      sel: sel,
      notes: notes,
      onNotes: this.onNotes,
      reviewed: reviewed,
      onReview: this.onReview,
      escalated: escalated,
      escalateDisabled: !reviewed || escalated,
      onEscalate: this.onEscalate
    };
  }
}
DC.mount(Component);
</script>
</body>
</html>
