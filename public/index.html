<style>
  :root{
    --navy-950:#0A0F1A;--navy-900:#0D1526;--navy-850:#101B30;--navy-800:#131F38;--navy-700:#1B2A47;--navy-600:#233757;
    --ink-0:#EDF1F7;--ink-300:#B7C4D9;--ink-500:#8296B4;--ink-muted:#64789B;
    --paper-0:#F7F7F3;--paper-100:#EFEEE7;--paper-ink-900:#161E2B;--paper-ink-600:#4B5768;
    --cyan:#2FC4DE;--green:#33BE7D;--amber:#E4A73C;--red:#E1484F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--navy-950);}
  a{text-decoration:none;color:inherit;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer;}
  .btn-primary{background:var(--cyan);color:#06222A;}
  .btn-primary:hover{background:#4FD3E8;}
  .btn-ghost{background:transparent;border-color:var(--navy-600);color:var(--ink-0);}
  .btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width:100%;min-height:100vh;background:var(--navy-950);color:var(--ink-0);display:flex;flex-direction:column;">

  <!-- Simulation banner -->
  <div class="ca-gutter" style="width:100%;background:var(--navy-900);border-bottom:1px solid var(--navy-700);padding:8px 40px;display:flex;align-items:center;justify-content:center;gap:8px;">
    <span class="mono" style="font-size:11px;letter-spacing:1px;color:var(--amber);text-transform:uppercase;">Simulated hackathon data</span>
    <span class="mono" style="font-size:11px;color:var(--ink-muted);">- no real drones, agencies, or individuals are represented</span>
  </div>

  <!-- Top nav -->
  <div class="ca-sitehead ca-gutter" style="width:100%;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--navy-800);">
    <div style="display:flex;align-items:center;gap:10px;">
